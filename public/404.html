<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Muthuja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: var(--color-bg);
            padding: 2rem;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-family: var(--font-heading);
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-msg {
            color: var(--color-secondary);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1 class="error-code">404</h1>
        <p class="error-msg">The page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn btn-primary">RETURN HOME</a>
    </div>
</body>
</html>
